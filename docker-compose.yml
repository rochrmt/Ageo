# ============================================================
#  AGEO — Stack Docker (app + MySQL) avec Traefik
#  Prérequis : Traefik doit tourner sur /opt/traefik/
#  Usage : copier .env.example → .env, puis docker compose up -d --build
#  Accès : https://${DOMAIN} (SSL automatique)
# ============================================================

services:
  # ── Base de données MySQL (interne, non exposée) ────────────────────────
  mysql:
    image: mysql:8.0
    container_name: ${CONTAINER_PREFIX}-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    volumes:
      - ${CONTAINER_PREFIX}-mysql-data:/var/lib/mysql
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  # ── Application (backend + frontend) ─────────────────────────────────────
  app:
    build: .
    container_name: ${CONTAINER_PREFIX}-app
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: "3001"
      DB_SERVER: mysql
      DB_PORT: "3306"
      DB_NAME: ${DB_NAME}
      DB_USER: root
      DB_PASSWORD: ${DB_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES: 10h
      LICENCE_SECRET: ${LICENCE_SECRET}
    volumes:
      - ${CONTAINER_PREFIX}-uploads:/app/server/uploads
    expose:
      - "3001"
    restart: unless-stopped
    networks:
      - default
      - traefik-proxy
    labels:
      - "traefik.enable=true"
      # Router : domaine de l'app
      - "traefik.http.routers.ageo.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.ageo.entrypoints=websecure"
      - "traefik.http.routers.ageo.tls.certresolver=letsencrypt"
      # Service : port interne de l'app
      - "traefik.http.services.ageo.loadbalancer.server.port=3001"
      # Middlewares : gzip + sécurité
      - "traefik.http.routers.ageo.middlewares=gzip@file,security-headers@file"

volumes:
  ${CONTAINER_PREFIX}-mysql-data:
  ${CONTAINER_PREFIX}-uploads:

networks:
  traefik-proxy:
    name: traefik-proxy
    external: true
