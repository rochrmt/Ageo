# ============================================================
#  AGEO — Stack Docker complète (app + SQL Server)
#  Usage : docker compose up -d --build
#  Accès réseau local : http://IP_DE_LA_MACHINE:3001
# ============================================================

services:
  # ── Base de données SQL Server ───────────────────────────────────────────
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: ageo-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      # IMPORTANT : le mot de passe doit être fort (8+ caractères, majuscules,
      # minuscules, chiffres). Modifiez-le ici ET dans la section "app" ci-dessous.
      MSSQL_SA_PASSWORD: Ageo@2026!
    volumes:
      # Les données persistent même si le conteneur est supprimé
      - ageo-sqlserver-data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    restart: unless-stopped

  # ── Application (backend + frontend) ─────────────────────────────────────
  app:
    build: .
    container_name: ageo-app
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      PORT: "3001"
      DB_SERVER: sqlserver          # nom du service SQL Server ci-dessus
      DB_PORT: "1433"
      DB_NAME: ageo
      DB_USER: sa
      DB_PASSWORD: Ageo@2026!       # doit correspondre à MSSQL_SA_PASSWORD
      DB_ENCRYPT: "false"
      DB_TRUST_CERT: "true"
      # Changez cette valeur par une chaîne aléatoire longue
      JWT_SECRET: changez_cette_valeur_par_une_chaine_aleatoire_longue
      JWT_EXPIRES: 10h
      # Secret de licence PROPRE à votre installation
      LICENCE_SECRET: 12fffd0329f96cf89632f961f0f24c8269552b2f6405ce5f3ba560b74f2bca5d16f8231e3ddc97ce97d215a7be976def
      # Laissez vide pour le mode interne (utilisation illimitée)
      LICENCE_KEY: ""
    volumes:
      # Fichiers uploadés (photos employés, documents) persistants
      - ageo-uploads:/app/server/uploads
    ports:
      # Port accessible depuis le réseau local
      - "3001:3001"
    restart: unless-stopped

volumes:
  ageo-sqlserver-data:
  ageo-uploads:
